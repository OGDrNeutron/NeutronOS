# NeutronOS runtime configuration
# Installed to: /etc/neutronos/neutronos.conf

NEUTRONOS_ROOT=/opt/neutronos
NEUTRONOS_STATE_DIR=/var/lib/neutronos
NEUTRONOS_SECURITY_STATE_DIR=/var/lib/neutronos/security
NEUTRONOS_WEB_CONTROLLER_HOST=0.0.0.0
NEUTRONOS_WEB_CONTROLLER_PORT=8091
NEUTRONOS_WEB_CONTROLLER_EVENT_FILE=/tmp/neutronos_controller.json
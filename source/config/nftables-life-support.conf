#!/usr/sbin/nft -f
# NeutronOS does not use the distro nftables unit as the firewall owner.
# The always-on neutronos-firewall-guard.service manages only NeutronOS-owned
# tables and never flushes the global nftables ruleset.  This file is kept
# intentionally non-destructive so a manual/vendor nftables.service start
# cannot erase Docker, Tailscale, fail2ban, NetworkManager, or NeutronOS rules.

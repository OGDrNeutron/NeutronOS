[Service]
# Replace the distribution command sequence so the reboot image is selected
# before the splash becomes visible.  This prevents a flash of the 0% frame.
ExecStart=
ExecStart=/usr/sbin/plymouthd --mode=reboot --attach-to-session
ExecStartPost=
ExecStartPost=/usr/local/sbin/neutronos-boot-progress reboot
ExecStartPost=-/usr/bin/plymouth show-splash

[Unit]
After=neutronos-firewall-guard.service neutron-securityd.service
Requires=neutronos-firewall-guard.service
Wants=neutron-securityd.service

[Service]
ExecStartPre=/usr/bin/python3 /usr/local/lib/neutronos/neutronos-firewall-guard.py --require-remote-safe
# Optional packages may use the shared /run/neutronos namespace but must never
# own it.  The 1.0.1 Remote Systems package used RuntimeDirectory=neutronos,
# which allowed a package restart to remove other NeutronOS runtime sockets.
RuntimeDirectory=
RuntimeDirectory=neutronos-remote-service
RuntimeDirectoryMode=0755
ReadWritePaths=
ReadWritePaths=/var/lib/neutronos/apps/neutronremotesystems /run/neutronos /run/neutronos-remote-service
InaccessiblePaths=/run/neutronos/security

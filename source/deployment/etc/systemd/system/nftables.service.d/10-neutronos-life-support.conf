[Unit]
Description=nftables compatibility shim (NeutronOS firewall life-support owns policy)
After=local-fs.target
Before=network-pre.target

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/neutronos/neutronos-firewall-guard.py --apply-once
ExecReload=
ExecReload=/usr/bin/python3 /usr/local/lib/neutronos/neutronos-firewall-guard.py --apply-once
ExecStop=
ExecStop=/bin/true

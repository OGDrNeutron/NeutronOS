name: Publish Neutron Media Libraries 1.1.0 package

on:
  push:
    branches:
      - apps/neutron-media-libraries-1.1.0
    paths:
      - .github/workflows/publish-nml-1.1.0.yml

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact signed package bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import tempfile
          import zipfile

          old = Path('Apps/NeutronMediaLibraries-1.0.5.Napp')
          patch_file = Path('.release-staging/neutron-media-libraries-1.1.0/release.patch')
          out = Path('Apps/NeutronMediaLibraries-1.1.0.Napp')
          expected = 'e624cc4bdaa70fd599f0db35e25935f78c61c2c636fe69f106496c82c0080643'

          if hashlib.sha256(old.read_bytes()).hexdigest() != '447ebf81226f0d07d429fb4a2a3e025f388b8bb79b0da3f4ea3d2a9a143dba36':
              raise SystemExit('Published 1.0.5 package is not the expected base')

          with tempfile.TemporaryDirectory() as td:
              work = Path(td)
              with zipfile.ZipFile(old, 'r') as zin:
                  zin.extractall(work)

              subprocess.run(
                  ['patch', '-p1', '--batch', '--forward'],
                  cwd=work,
                  input=patch_file.read_bytes(),
                  check=True,
              )

              with zipfile.ZipFile(old, 'r') as zin, zipfile.ZipFile(out, 'w') as zout:
                  for zi in zin.infolist():
                      data = (work / zi.filename).read_bytes()
                      nz = zipfile.ZipInfo(zi.filename, zi.date_time)
                      nz.compress_type = zi.compress_type
                      nz.comment = zi.comment
                      nz.extra = zi.extra
                      nz.create_system = zi.create_system
                      nz.create_version = zi.create_version
                      nz.extract_version = zi.extract_version
                      nz.flag_bits = zi.flag_bits
                      nz.volume = zi.volume
                      nz.internal_attr = zi.internal_attr
                      nz.external_attr = zi.external_attr
                      zout.writestr(nz, data)

          actual = hashlib.sha256(out.read_bytes()).hexdigest()
          if actual != expected:
              out.unlink(missing_ok=True)
              raise SystemExit(f'Rebuilt package SHA mismatch: {actual}')
          if out.stat().st_size != 3729450:
              out.unlink(missing_ok=True)
              raise SystemExit(f'Rebuilt package size mismatch: {out.stat().st_size}')
          print('Exact package SHA verified:', actual)
          PY

      - name: Commit immutable package and remove one-shot staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeutronOS Release Bot'
          git config user.email 'OGDrNeutron@proton.me'
          git add -- Apps/NeutronMediaLibraries-1.1.0.Napp
          git rm -- .release-staging/neutron-media-libraries-1.1.0/release.patch
          git rm -- .github/workflows/publish-nml-1.1.0.yml
          git commit -m 'Stage Neutron Media Libraries 1.1.0 package'
          git push origin HEAD:"${GITHUB_REF_NAME}"
